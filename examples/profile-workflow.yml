# Copy this file to .github/workflows/bomber.yml in your profile repository
# (the repository named exactly like your user name, e.g. octocat/octocat).
# It needs no secrets: the default workflow token is enough.
name: Contribution bomber

on:
  schedule:
    - cron: "17 */12 * * *" # twice a day
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write # only to push the generated images to the `output` branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate SVGs
        uses: BangJeongHyeok/github-grass-bomberman@main
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-bomber.svg
            dist/github-bomber-dark.svg?theme=dark

      - name: Publish to the output branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update contribution bomber ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
