name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: Bundled action is up to date
        run: |
          npm run build
          git diff --exit-code -- dist || (echo "::error::dist/ is stale - run 'npm run build' and commit it" && exit 1)
      - name: Render sample animations
        run: |
          node dist/cli.js --source sample --outputs "out/sample.svg
          out/sample-dark.svg?theme=dark"
          npx tsx scripts/preview.ts out/sample.svg --img-check
      - uses: actions/upload-artifact@v7
        with:
          name: sample-svgs
          path: out/

  action:
    # Runs the action exactly like a profile repository would (sample data, no push).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            out/a.svg
            out/b.svg?theme=dark&seed=1
      - run: test -s out/a.svg && test -s out/b.svg && ls -la out
