# Regenerates the animation for the owner of this repository and publishes it
# to the `output` branch:
#   https://raw.githubusercontent.com/<owner>/<repo>/output/github-bomber.svg
name: Generate contribution bomber

on:
  schedule:
    - cron: "17 */12 * * *" # twice a day
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dist/**", "action.yml", ".github/workflows/generate.yml"]

permissions:
  contents: write # needed only to push the `output` branch

concurrency:
  group: contribution-bomber
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Generate SVGs
        uses: ./
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist-out/github-bomber.svg
            dist-out/github-bomber-dark.svg?theme=dark

      - name: Publish to the output branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist-out
          cat > README.md <<'EOF'
          Generated by the "Generate contribution bomber" workflow. Do not edit by hand.
          EOF
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update contribution bomber ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
          echo "Published: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/output/github-bomber.svg"
